<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos · Focus Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── 4 Curated Palettes ── */
  :root {
    --bg: #f7f5f0;
    --surface: rgba(255, 255, 255, 0.85);
    --surface-border: rgba(28, 28, 32, 0.08);
    --ink: #1c1c20;
    --ink-muted: #807d76;
    --sand: #222226;
    --sand-glint: rgba(255, 255, 255, 0.7);
    --glass-stroke: rgba(28, 28, 32, 0.13);
    --cap: #28282c;
    --border: rgba(28, 28, 32, 0.1);
    --border-hover: rgba(28, 28, 32, 0.25);
    --accent: #1c1c20;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
    --font-num: 'Space Grotesk', sans-serif;
    --font-ui: 'Inter', sans-serif;
  }

  body.theme-obsidian {
    --bg: #0e0d11;
    --surface: rgba(22, 21, 26, 0.88);
    --surface-border: rgba(255, 255, 255, 0.08);
    --ink: #f4ede2;
    --ink-muted: #827c70;
    --sand: #e2b35b;
    --sand-glint: rgba(255, 240, 200, 0.9);
    --glass-stroke: rgba(255, 255, 255, 0.1);
    --cap: #26231c;
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(255, 255, 255, 0.25);
    --accent: #e2b35b;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }

  body.theme-nordic {
    --bg: #15161a;
    --surface: rgba(26, 27, 33, 0.88);
    --surface-border: rgba(255, 255, 255, 0.08);
    --ink: #f2f3f5;
    --ink-muted: #787c88;
    --sand: #f0f2f5;
    --sand-glint: rgba(255, 255, 255, 0.95);
    --glass-stroke: rgba(255, 255, 255, 0.12);
    --cap: #2a2b33;
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.25);
    --accent: #e06d53;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }

  body.theme-forest {
    --bg: #101412;
    --surface: rgba(19, 25, 22, 0.88);
    --surface-border: rgba(255, 255, 255, 0.08);
    --ink: #e8ece8;
    --ink-muted: #6b7a71;
    --sand: #c87a58;
    --sand-glint: rgba(255, 220, 200, 0.85);
    --glass-stroke: rgba(255, 255, 255, 0.09);
    --cap: #1f2822;
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.25);
    --accent: #8ea891;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    transition: background 0.5s ease, color 0.4s ease;
  }

  /* ── Subtle Floating Top Corner Dock ── */
  .corner-dock {
    position: fixed;
    top: 24px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    opacity: 0.35;
    transition: opacity 0.3s ease;
  }
  .corner-dock:hover { opacity: 1; }

  .dock-btn {
    background: none;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    color: var(--ink-muted);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.2s ease, transform 0.15s ease;
  }
  .dock-btn:hover {
    color: var(--ink);
    transform: translateY(-1px);
  }
  .dock-btn.active { color: var(--ink); }

  /* ── Theme Popover ── */
  /* FIX #5: wrapper needs position:relative for popover placement */
  .theme-wrapper { position: relative; }

  .theme-popover {
    position: fixed; /* fixed so it escapes the dock's opacity context */
    top: 60px;
    right: 28px;
    /* Solid background — no backdrop-filter so swatch colors stay vivid */
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    gap: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.06);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px) scale(0.95);
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 9999; /* above everything including the faded dock */
  }
  .theme-popover.open {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0) scale(1);
  }
  .theme-option {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    /* Inset ring: makes light swatches like Washi Paper always visible */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .theme-option:hover { transform: scale(1.18); }
  .theme-option.active { border-color: #333; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15), 0 0 0 2px #fff, 0 0 0 4px #333; }

  /* ── Center Stage & 3D Parallax ── */
  .zen-stage {
    perspective: 1000px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .hourglass-container {
    position: relative;
    width: 250px;
    height: 360px;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    cursor: pointer;
  }

  /* Physical 180° Flip */
  .hourglass-container.flip-motion {
    animation: flipTumble 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
  }
  @keyframes flipTumble {
    0%   { transform: rotateZ(0deg)   scale(1); }
    50%  { transform: rotateZ(90deg)  scale(1.06); }
    100% { transform: rotateZ(180deg) scale(1); }
  }

  canvas, svg.hg-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  svg.hg-svg { z-index: 1; pointer-events: none; }
  canvas { z-index: 2; }

  /* ── Time & Minimal Flow ── */
  .bottom-flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    transition: opacity 0.5s ease;
  }

  .time-display {
    font-family: var(--font-num);
    font-size: 40px;
    font-weight: 400;
    letter-spacing: 2px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    /* FIX #6: cursor only pointer when NOT running */
    transition: color 0.2s, opacity 0.3s;
  }
  .time-display.clickable { cursor: pointer; }
  .time-display.clickable:hover { opacity: 0.8; }
  .time-display.active { font-weight: 500; }

  /* Task / Intention Anchor */
  .task-anchor {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--ink-muted);
    font-family: var(--font-ui);
    font-size: 11px;
    text-align: center;
    outline: none;
    padding: 2px 6px;
    width: 220px;
    transition: all 0.2s;
  }
  .task-anchor:hover, .task-anchor:focus {
    border-color: var(--border);
    color: var(--ink);
  }
  .task-anchor::placeholder {
    color: var(--ink-muted);
    opacity: 0.6;
  }

  /* Quiet Presets */
  .presets-quiet {
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .presets-quiet:hover { opacity: 1; }

  .preset-dot {
    background: none;
    border: none;
    color: var(--ink-muted);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s;
  }
  .preset-dot:hover, .preset-dot.active { color: var(--ink); }

  /* Action row: start + reset */
  .action-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-zen {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px 30px;
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-zen:hover {
    border-color: var(--border-hover);
    background: rgba(128,128,128,0.05);
    transform: translateY(-1px);
  }
  .btn-zen.running {
    border-color: var(--border);
    color: var(--ink-muted);
  }

  /* FIX #9: Subtle reset button (always visible, minimal) */
  .btn-reset {
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.2s, transform 0.3s ease;
    line-height: 1;
  }
  .btn-reset:hover {
    opacity: 1;
    transform: rotate(-180deg);
  }

  /* Running state: smoothly fade down secondary controls */
  body.running .presets-quiet,
  body.running .btn-zen,
  body.running .task-anchor,
  body.running .btn-reset {
    opacity: 0.2;
    transition: opacity 0.6s ease;
  }
  body.running .bottom-flow:hover .presets-quiet,
  body.running .bottom-flow:hover .btn-zen,
  body.running .bottom-flow:hover .task-anchor,
  body.running .bottom-flow:hover .btn-reset {
    opacity: 0.9;
  }

  /* ── Frosted Side Sheet ── */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sheet-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .side-sheet {
    position: fixed;
    top: 0; right: 0;
    width: 360px;
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--surface-border);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: -20px 0 60px rgba(0,0,0,0.15);
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 0;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 201;
    overflow-y: auto; /* FIX #10: properly scrollable on short viewports */
  }
  .sheet-overlay.open .side-sheet {
    transform: translateX(0);
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-shrink: 0;
  }
  .sheet-title {
    font-family: var(--font-num);
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
  }
  .sheet-close {
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s;
  }
  .sheet-close:hover { color: var(--ink); }

  /* 7-Day Habit Matrix */
  .habit-section { margin-bottom: 24px; flex-shrink: 0; }
  .section-label {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }
  .habit-row {
    display: flex;
    justify-content: space-between;
    background: rgba(128,128,128,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .habit-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .habit-letter {
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--ink-muted);
  }
  .habit-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.2s;
  }
  .habit-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* Stat Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
    flex-shrink: 0;
  }
  .stat-card {
    background: rgba(128,128,128,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .stat-val {
    font-family: var(--font-num);
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
  }
  .stat-val span { font-size: 12px; color: var(--ink-muted); margin-left: 2px; }
  .stat-desc {
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* History list */
  .history-label { flex-shrink: 0; }
  .history-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0; /* FIX #10: allow proper flex shrink for scrolling */
  }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: rgba(128,128,128,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 11px;
  }
  .history-time { color: var(--ink-muted); }
  .history-dur { color: var(--ink); font-weight: 500; font-family: var(--font-num); }
</style>
</head>
<body class="theme-washi">

<!-- Subtle Floating Dock (Top Right) -->
<div class="corner-dock">
  <button class="dock-btn" id="soundBtn" onclick="toggleSound()" title="Sand Whisper Sound (M)">
    <span id="soundIcon">🔇</span>
  </button>

  <!-- FIX #5: theme wrapper has ID for outside-click detection -->
  <div class="theme-wrapper" id="themeWrapper">
    <button class="dock-btn" id="themeBtn" onclick="toggleThemePopover()" title="Change Theme (T)">
      <span>◑</span>
    </button>
    <div class="theme-popover" id="themePopover">
      <div class="theme-option active" style="background:#f7f5f0;" onclick="setTheme('washi')"    title="Washi Paper"></div>
      <div class="theme-option"        style="background:#0e0d11;" onclick="setTheme('obsidian')" title="Obsidian Amber"></div>
      <div class="theme-option"        style="background:#15161a;" onclick="setTheme('nordic')"   title="Nordic Slate"></div>
      <div class="theme-option"        style="background:#101412;" onclick="setTheme('forest')"   title="Forest Moss"></div>
    </div>
  </div>

  <button class="dock-btn" onclick="openSheet()" title="Momentum & Stats (S)">
    <span>🏆</span>
    <span id="headerCount">0</span>
  </button>

  <button class="dock-btn" onclick="toggleFullscreen()" title="Fullscreen (F)">⛶</button>
</div>

<!-- Center Stage -->
<div class="zen-stage">
  <div class="hourglass-container" id="hgContainer" onclick="toggleTimer()" title="Click or press Space">
    <svg class="hg-svg" viewBox="0 0 300 480">
      <defs>
        <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   style="stop-color:rgba(255,255,255,0.15)"/>
          <stop offset="100%" style="stop-color:rgba(0,0,0,0.2)"/>
        </linearGradient>
      </defs>
      <rect x="42" y="16"  width="216" height="8" rx="2" fill="var(--cap)"/>
      <rect x="42" y="16"  width="216" height="8" rx="2" fill="url(#capGrad)"/>
      <rect x="42" y="456" width="216" height="8" rx="2" fill="var(--cap)"/>
      <rect x="42" y="456" width="216" height="8" rx="2" fill="url(#capGrad)"/>
      <path d="M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z"
        fill="none" stroke="var(--glass-stroke)" stroke-width="1.4"/>
    </svg>
    <canvas id="sandCanvas" width="300" height="480"></canvas>
  </div>

  <div class="bottom-flow">
    <!-- FIX #6: clickable only when NOT running (class toggled in JS) -->
    <div class="time-display clickable" id="timeDisplay" onclick="promptCustomMinutes()" title="Click to set custom minutes">25:00</div>

    <input type="text" class="task-anchor" id="taskAnchor" placeholder="What are you focusing on?" maxlength="40">

    <div class="presets-quiet">
      <button class="preset-dot" onclick="selectPreset(15)">15m</button>
      <button class="preset-dot active" onclick="selectPreset(25)">25m</button>
      <button class="preset-dot" onclick="selectPreset(45)">45m</button>
    </div>

    <!-- FIX #9: action row includes visible reset button -->
    <div class="action-row">
      <button class="btn-zen" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-reset" id="resetBtn" onclick="resetTimer()" title="Reset (R)">↺</button>
    </div>
  </div>
</div>

<!-- Frosted Side Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="handleOverlayClick(event)">
  <div class="side-sheet">
    <div class="sheet-head">
      <div class="sheet-title">Momentum</div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>

    <div class="habit-section">
      <div class="section-label">Last 7 Days</div>
      <div class="habit-row" id="habitRow"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="sheetSessions">0</div>
        <div class="stat-desc">Sessions Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sheetTime">0<span>m</span></div>
        <div class="stat-desc">Total Focus Time</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sheetStreak">0<span>d</span></div>
        <div class="stat-desc">Current Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sheetBest">0</div>
        <div class="stat-desc">Best Day</div>
      </div>
    </div>

    <div class="section-label history-label">Recent Sessions</div>
    <div class="history-list" id="sheetHistory">
      <div style="text-align:center;padding:24px;font-size:11px;color:var(--ink-muted);">No completed sessions yet</div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   THEMES
══════════════════════════════════════════════ */
const THEMES = ['washi', 'obsidian', 'nordic', 'forest'];
let currentTheme = localStorage.getItem('hg_theme_v1') || 'washi';

function applyTheme(name) {
  currentTheme = name;
  // FIX #1: don't clobber 'running' class — remove only theme classes
  THEMES.forEach(t => document.body.classList.remove(`theme-${t}`));
  document.body.classList.add(`theme-${name}`);
  localStorage.setItem('hg_theme_v1', name);
  document.querySelectorAll('.theme-option').forEach((el, i) => {
    el.classList.toggle('active', THEMES[i] === name);
  });
  draw();
}

function setTheme(name) {
  applyTheme(name);
  document.getElementById('themePopover').classList.remove('open');
}

function toggleThemePopover() {
  document.getElementById('themePopover').classList.toggle('open');
}

// FIX #5: close theme popover when clicking anywhere outside the wrapper
document.addEventListener('click', (e) => {
  const wrapper = document.getElementById('themeWrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('themePopover').classList.remove('open');
  }
});

/* ══════════════════════════════════════════════
   DATE UTILITY (FIX #3: always use LOCAL date, never UTC)
══════════════════════════════════════════════ */
function localDateKey(date) {
  const d = (date instanceof Date) ? date : new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ══════════════════════════════════════════════
   CURSOR PARALLAX (3D Tilt)
══════════════════════════════════════════════ */
const hgContainer = document.getElementById('hgContainer');
window.addEventListener('mousemove', (e) => {
  if (hgContainer.classList.contains('flip-motion')) return;
  const xRatio = (e.clientX / window.innerWidth)  - 0.5;
  const yRatio = (e.clientY / window.innerHeight) - 0.5;
  hgContainer.style.transform = `rotateX(${-yRatio * 14}deg) rotateY(${xRatio * 14}deg)`;
});

/* ══════════════════════════════════════════════
   WEB AUDIO — Sand Whisper & Completion Chime
══════════════════════════════════════════════ */
let audioCtx    = null;
let soundEnabled = false;
let noiseNode   = null;
let noiseGain   = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startSandWhisper() {
  if (!soundEnabled || noiseNode) return;
  initAudio();

  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + w * 0.0555179;
    b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520;
    data[i] = (b0 + b1 + b2) * 0.11;
  }

  noiseNode = audioCtx.createBufferSource();
  noiseNode.buffer = buffer;
  noiseNode.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
  filter.Q.setValueAtTime(1.8, audioCtx.currentTime);

  noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.5);

  noiseNode.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noiseNode.start();
}

function stopSandWhisper() {
  if (!noiseGain || !audioCtx) return;
  try {
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
    const nodeToStop = noiseNode;
    const gainToNull = noiseGain;
    noiseNode = null;  // null immediately so startSandWhisper can be called without waiting
    noiseGain = null;
    setTimeout(() => {
      try { nodeToStop.stop(); nodeToStop.disconnect(); } catch (e) {}
      try { gainToNull.disconnect(); }                   catch (e) {}
      // FIX #7: both node AND gain are nulled (node nulled above, gain nulled above)
    }, 350);
  } catch (e) {
    noiseNode = null;
    noiseGain = null;
  }
}

function playCompletionChime() {
  initAudio();
  try {
    const now = audioCtx.currentTime;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(528, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 2.8);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.9);
  } catch (e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundBtn').classList.toggle('active', soundEnabled);
  if (soundEnabled && isRunning) startSandWhisper();
  else stopSandWhisper();
}

/* ══════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════ */
function toggleFullscreen() {
  if (!document.fullscreenElement)
    document.documentElement.requestFullscreen().catch(() => {});
  else
    document.exitFullscreen().catch(() => {});
}

/* ══════════════════════════════════════════════
   CANVAS & PARTICLES
══════════════════════════════════════════════ */
const canvas = document.getElementById('sandCanvas');
const ctx    = canvas.getContext('2d');
const glassPath = new Path2D("M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z");

let isRunning        = false;
let currentMinutes   = 25;
let totalSeconds     = 25 * 60;
let remainingSeconds = 25 * 60;
let lastTimestamp    = 0;
let rafId            = null; // FIX #2: track RAF handle for clean cancellation

let streamParticles = [];
let splashParticles = [];

class Grain {
  constructor() {
    this.x      = 150 + (Math.random() - 0.5) * 2.5;
    this.y      = 248;
    this.vy     = 4.8 + Math.random() * 3.2;
    this.vx     = (Math.random() - 0.5) * 0.7;
    this.radius = 0.9 + Math.random() * 0.3;
    this.isGlint = Math.random() < 0.25;
    this.alpha  = 0.7 + Math.random() * 0.3;
  }
  update() { this.y += this.vy; this.x += this.vx; }
}

class Splash {
  constructor(x, y) {
    this.x      = x;
    this.y      = y;
    this.vx     = (Math.random() - 0.5) * 2.8;
    this.vy     = -(0.7 + Math.random() * 1.6);
    this.alpha  = 0.7;
    this.radius = 0.8;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.2;
    this.alpha -= 0.05;
  }
}

function getVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const progress   = totalSeconds > 0 ? Math.max(0, Math.min(1, remainingSeconds / totalSeconds)) : 1;
  const sandColor  = getVar('--sand');
  const glintColor = getVar('--sand-glint');

  ctx.save();
  ctx.scale(canvas.width / 300, canvas.height / 480);
  ctx.clip(glassPath);

  // Upper Chamber
  if (progress > 0.002) {
    const topH = 224 * progress;
    const topY = 248 - topH;
    const craterDepth = Math.min(16, (1 - progress) * 22);

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, topY);
    ctx.quadraticCurveTo(150, topY + craterDepth, 258, topY);
    ctx.lineTo(258, 248);
    ctx.lineTo(42, 248);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(42, topY);
    ctx.quadraticCurveTo(150, topY + craterDepth, 258, topY);
    ctx.strokeStyle = glintColor;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Lower Chamber
  const invProgress = 1 - progress;
  if (invProgress > 0.002) {
    const botH       = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2;

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, 456);
    ctx.lineTo(42, 456 - botH);
    ctx.quadraticCurveTo(150, 456 - botH - peakHeight, 258, 456 - botH);
    ctx.lineTo(258, 456);
    ctx.closePath();
    ctx.fill();
  }

  // Falling Stream
  if (isRunning && remainingSeconds > 0) {
    const botH       = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2;
    const moundTop   = 456 - botH - peakHeight;

    ctx.strokeStyle = sandColor;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(150, 248);
    ctx.lineTo(150, moundTop);
    ctx.stroke();

    for (let i = 0; i < 2; i++) streamParticles.push(new Grain());
    if (Math.random() < 0.35) splashParticles.push(new Splash(150, moundTop));
  }

  // Render stream grains
  const currentTop = 456 - (208 * invProgress) - (invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2);
  for (let i = streamParticles.length - 1; i >= 0; i--) {
    const p = streamParticles[i];
    if (isRunning) p.update();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.isGlint ? glintColor : sandColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    if (p.y >= currentTop) streamParticles.splice(i, 1);
  }

  // Render splash grains — FIX #4: guard with isRunning
  for (let i = splashParticles.length - 1; i >= 0; i--) {
    const sp = splashParticles[i];
    if (isRunning) sp.update(); // FIX #4: don't advance when paused
    if (sp.alpha <= 0) { splashParticles.splice(i, 1); continue; }
    ctx.globalAlpha = sp.alpha;
    ctx.fillStyle   = sandColor;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ══════════════════════════════════════════════
   TIMER ENGINE
══════════════════════════════════════════════ */
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updateDisplay() {
  const fmt  = formatTime(remainingSeconds);
  const task = document.getElementById('taskAnchor').value.trim();
  document.getElementById('timeDisplay').textContent = fmt;
  document.title = isRunning ? `(${fmt}) ${task || 'Chronos'}` : 'Chronos · Focus Sanctuary';
}

function setRunningUI(running) {
  const btn = document.getElementById('startBtn');
  const td  = document.getElementById('timeDisplay');
  if (running) {
    document.body.classList.add('running');
    btn.textContent = 'Pause';
    btn.classList.add('running');
    td.classList.add('active');
    td.classList.remove('clickable'); // FIX #6: disable click-to-edit while running
  } else {
    document.body.classList.remove('running');
    btn.classList.remove('running');
    td.classList.remove('active');
    td.classList.add('clickable');   // FIX #6: re-enable click-to-edit when paused
  }
}

function toggleTimer(e) {
  if (e) e.stopPropagation();
  if (!isRunning) {
    if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
    isRunning = true;
    lastTimestamp = performance.now();
    setRunningUI(true);
    document.getElementById('startBtn').textContent = 'Pause';
    startSandWhisper();
    rafId = requestAnimationFrame(animationLoop); // FIX #2: save rafId
  } else {
    isRunning = false;
    setRunningUI(false);
    document.getElementById('startBtn').textContent = 'Resume';
    stopSandWhisper();
  }
}

function resetTimer() {
  isRunning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; } // FIX #2
  remainingSeconds = totalSeconds;
  streamParticles  = [];
  splashParticles  = [];
  setRunningUI(false);
  document.getElementById('startBtn').textContent = 'Start';
  stopSandWhisper();

  // Physical 180° Tumbling Flip
  hgContainer.classList.add('flip-motion');
  setTimeout(() => {
    hgContainer.classList.remove('flip-motion');
    hgContainer.style.transform = 'rotateX(0deg) rotateY(0deg)';
  }, 800);

  updateDisplay();
  draw();
}

function animationLoop(now) {
  if (!isRunning) return;
  const delta    = (now - lastTimestamp) / 1000;
  remainingSeconds = Math.max(0, remainingSeconds - delta);
  lastTimestamp  = now;

  updateDisplay();

  if (remainingSeconds <= 0) {
    isRunning = false;
    remainingSeconds = 0;
    rafId = null;
    setRunningUI(false);
    document.getElementById('startBtn').textContent = 'Start';
    stopSandWhisper();
    playCompletionChime();
    recordSession(currentMinutes);
    draw();
    return;
  }

  draw();
  rafId = requestAnimationFrame(animationLoop); // FIX #2: always update rafId
}

function selectPreset(m) {
  if (isRunning) toggleTimer(); // pause first
  currentMinutes   = m;
  totalSeconds     = m * 60;
  remainingSeconds = totalSeconds;

  document.querySelectorAll('.preset-dot').forEach(d => d.classList.remove('active'));
  const dot = Array.from(document.querySelectorAll('.preset-dot')).find(d => d.textContent === `${m}m`);
  if (dot) dot.classList.add('active');

  updateDisplay();
  draw();
}

// FIX #6: guard — don't open prompt while the timer is running
function promptCustomMinutes() {
  if (isRunning) return;
  const val = prompt('Custom focus minutes (1 – 180):', currentMinutes);
  if (!val) return;
  const num = parseInt(val, 10);
  if (!isNaN(num) && num > 0 && num <= 180) selectPreset(num);
}

/* ══════════════════════════════════════════════
   FIX #2: Smart Background Tab Throttling
   — cancel RAF on hide, restart cleanly on show
══════════════════════════════════════════════ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (isRunning) stopSandWhisper();
  } else {
    if (isRunning) {
      lastTimestamp = performance.now(); // re-sync so delta is correct
      startSandWhisper();
      rafId = requestAnimationFrame(animationLoop);
    }
  }
});

/* ══════════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════════ */
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')  { e.preventDefault(); toggleTimer(); }
  else if (e.code === 'KeyR') resetTimer();
  else if (e.code === 'KeyF') toggleFullscreen();
  else if (e.code === 'KeyS') openSheet();
  else if (e.code === 'KeyT') {
    applyTheme(THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length]);
  }
  else if (e.code === 'KeyM') toggleSound();
  else if (e.code === 'Escape') {
    closeSheet();
    document.getElementById('themePopover').classList.remove('open');
  }
});

/* ══════════════════════════════════════════════
   LOCAL STATS  (FIX #3: all dates use localDateKey)
══════════════════════════════════════════════ */
const STORAGE_KEY = 'hg_sessions_v1';

function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}

function recordSession(mins) {
  const list = getSessions();
  const task = document.getElementById('taskAnchor').value.trim();
  list.push({ date: new Date().toISOString(), mins, task });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  refreshHeaderCount();
}

function refreshHeaderCount() {
  document.getElementById('headerCount').textContent = getSessions().length;
}

function openSheet() {
  const list      = getSessions();
  const totalMins = list.reduce((a, b) => a + b.mins, 0);

  document.getElementById('sheetSessions').textContent = list.length;
  const hrs  = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  document.getElementById('sheetTime').innerHTML = hrs > 0
    ? `${hrs}<span>h</span> ${mins}<span>m</span>`
    : `${mins}<span>m</span>`;

  // FIX #3: use localDateKey everywhere
  const byDate = {};
  list.forEach(s => {
    const key = localDateKey(s.date);
    byDate[key] = (byDate[key] || 0) + 1;
  });

  document.getElementById('sheetBest').textContent =
    Object.values(byDate).reduce((a, b) => Math.max(a, b), 0);

  // Streak — FIX #3: cursor uses localDateKey, not toISOString
  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  const todayKey = localDateKey(cursor);
  if (!byDate[todayKey]) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const k = localDateKey(cursor);
    if (byDate[k]) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  document.getElementById('sheetStreak').innerHTML = `${streak}<span>d</span>`;

  // 7-Day Habit Row — FIX #3
  const habitRow = document.getElementById('habitRow');
  habitRow.innerHTML = '';
  const dayLetters = ['S','M','T','W','T','F','S'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - i);
    const key    = localDateKey(d);
    const active = !!byDate[key];
    const col    = document.createElement('div');
    col.className = 'habit-day';
    col.innerHTML = `
      <span class="habit-letter">${dayLetters[d.getDay()]}</span>
      <div class="habit-dot ${active ? 'active' : ''}"></div>
    `;
    habitRow.appendChild(col);
  }

  // Session History
  const histEl = document.getElementById('sheetHistory');
  if (list.length === 0) {
    histEl.innerHTML = '<div style="text-align:center;padding:24px;font-size:11px;color:var(--ink-muted);">No completed sessions yet</div>';
  } else {
    histEl.innerHTML = '';
    [...list].reverse().slice(0, 15).forEach(s => {
      const d   = new Date(s.date);
      const row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = `
        <span class="history-time">${d.toLocaleDateString(undefined, {month:'short', day:'numeric'})} · ${s.task || 'Focus'}</span>
        <span class="history-dur">${s.mins}m</span>
      `;
      histEl.appendChild(row);
    });
  }

  document.getElementById('sheetOverlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target.id === 'sheetOverlay') closeSheet();
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
applyTheme(currentTheme);
refreshHeaderCount();
updateDisplay();
draw();
</script>
</body>
