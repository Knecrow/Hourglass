<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-dim: #7a6230;
    --gold-glow: rgba(201,168,76,0.18);
    --bg: #0f0f0f;
    --surface: rgba(22, 22, 22, 0.75);
    --border: rgba(255,255,255,0.1);
    --text: #e8e2d6;
    --muted: #5a5650;
    --sans: 'Cormorant Garamond', Georgia, serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .menu-toggle {
    position: fixed;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    z-index: 1001;
    background: rgba(22, 22, 22, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-left: none;
    color: var(--gold);
    width: 30px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 0 8px 8px 0;
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .menu-toggle::after {
    content: '›';
    font-size: 24px;
    transition: transform 0.3s ease;
  }

  .sidebar.open ~ .menu-toggle::after { transform: rotate(180deg); }
  .sidebar.open ~ .menu-toggle { left: 220px; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 220px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 32px 20px 28px;
    overflow-y: auto;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1000;
    transform: translateX(-100%);
    box-shadow: 10px 0 30px rgba(0,0,0,0.5);
  }

  .sidebar.open { transform: translateX(0); }

  .wordmark {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.65;
    margin-bottom: 36px;
    text-align: center;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .control-group { margin-bottom: 18px; }

  .time-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    text-align: center;
  }
  .time-input:focus { border-color: var(--gold-dim); }

  .color-picker-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
  }
  .color-input {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    width: 24px;
    height: 24px;
    background: none;
    cursor: pointer;
  }
  .color-input::-webkit-color-swatch { border-radius: 50%; border: 1px solid var(--border); }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .switch-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 18px;
  }
  .slider:before {
    position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
    background-color: var(--muted); transition: .4s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--gold-dim); }
  input:checked + .slider:before { transform: translateX(16px); background-color: var(--gold); }

  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .preset-btn {
    padding: 7px 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 3px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 8px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .preset-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* ── Sidebar quick-stat pill ── */
  .stat-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(201,168,76,0.06);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 18px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .stat-pill:hover { background: rgba(201,168,76,0.12); border-color: rgba(201,168,76,0.35); }
  .stat-pill-label { font-family: var(--mono); font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-pill-value { font-family: var(--mono); font-size: 13px; color: var(--gold); }

  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 20px; }
  .btn-primary {
    width: 100%; padding: 13px;
    background: var(--gold);
    border: none; border-radius: 3px;
    color: #0f0f0f;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-ghost {
    width: 100%; padding: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1c1a14 0%, var(--bg) 65%);
  }

  .hourglass-wrap { position: relative; width: 300px; height: 480px; }
  canvas, svg.hg-svg { position: absolute; top: 0; left: 0; }
  svg.hg-svg { width: 100%; height: 100%; z-index: 1; }
  canvas { z-index: 2; }

  #timerDisplay {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
    opacity: 0.4;
    display: none;
  }

  /* ══════════════════════════════════
     LEADERBOARD MODAL
  ══════════════════════════════════ */
  .lb-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lb-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .lb-modal {
    width: 380px;
    max-height: 85vh;
    background: rgba(18, 17, 14, 0.96);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(201,168,76,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(16px) scale(0.97);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .lb-overlay.visible .lb-modal {
    transform: translateY(0) scale(1);
  }

  .lb-header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .lb-title {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .lb-subtitle {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .lb-close {
    background: none;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .lb-close:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }

  .lb-body { padding: 24px 28px; overflow-y: auto; flex: 1; }

  /* Four stat cards in a 2×2 grid */
  .lb-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .lb-stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 14px 14px 12px;
    position: relative;
    overflow: hidden;
  }
  .lb-stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
  }
  .lb-stat-card-icon { font-size: 16px; margin-bottom: 8px; }
  .lb-stat-card-val {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--text);
    line-height: 1;
  }
  .lb-stat-card-val span { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .lb-stat-card-label {
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Section divider */
  .lb-section-label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lb-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }

  /* History list */
  .lb-history { display: flex; flex-direction: column; gap: 6px; }
  .lb-history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 5px;
    transition: background 0.15s;
  }
  .lb-history-item:hover { background: rgba(255,255,255,0.04); }
  .lb-history-rank {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    width: 20px;
    flex-shrink: 0;
  }
  .lb-history-rank.gold   { color: #c9a84c; }
  .lb-history-rank.silver { color: #a0a0a0; }
  .lb-history-rank.bronze { color: #a0714a; }
  .lb-history-date {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    flex: 1;
    margin: 0 10px;
  }
  .lb-history-dur {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
  }
  .lb-history-badge {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.6;
    margin-left: 10px;
    flex-shrink: 0;
  }

  .lb-empty {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
    line-height: 1.8;
  }

  /* Streak bar */
  .lb-streak-row {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .lb-streak-day {
    width: 8px; height: 8px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
  }
  .lb-streak-day.active { background: var(--gold); opacity: 0.85; }
  .lb-streak-day.today  { background: var(--gold); box-shadow: 0 0 4px rgba(201,168,76,0.6); }

  /* Footer */
  .lb-footer {
    padding: 16px 28px 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .lb-clear-btn {
    width: 100%;
    padding: 9px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 3px;
    color: rgba(90,86,80,0.6);
    font-family: var(--mono);
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .lb-clear-btn:hover { border-color: rgba(200,60,60,0.4); color: rgba(200,100,100,0.8); }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="wordmark">Chronos</div>
  <div class="section-label">Enter Minutes</div>
  <div class="control-group">
    <input type="number" id="minInput" class="time-input" value="25" min="1" oninput="updateMins(this.value)">
  </div>
  
  <!-- Sand Color Control -->
  <div class="section-label">Sand Color</div>
  <div class="control-group">
    <div class="color-picker-container">
        <span class="switch-label">Select Tint</span>
        <input type="color" id="sandColorPicker" class="color-input" value="#c9a84c" oninput="updateSandColor(this.value)">
    </div>
  </div>

  <div class="switch-row">
    <div class="switch-label">Show Timer</div>
    <label class="switch">
      <input type="checkbox" id="showTimerToggle" onchange="toggleTimerDisplay(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-label">Quick Set</div>
  <div class="presets" style="margin-bottom:18px;">
    <button class="preset-btn" onclick="setPreset(5)">5 min</button>
    <button class="preset-btn" onclick="setPreset(15)">15 min</button>
    <button class="preset-btn" onclick="setPreset(25)">25 min</button>
    <button class="preset-btn" onclick="setPreset(45)">45 min</button>
    <button class="preset-btn" onclick="setPreset(60)">1 hour</button>
    <button class="preset-btn" onclick="setPreset(90)">90 min</button>
  </div>

  <!-- Quick-stat pill — opens leaderboard modal -->
  <div class="section-label">My Progress</div>
  <div class="stat-pill" id="statPill" onclick="openLeaderboard()" title="View full stats">
    <span class="stat-pill-label">Sessions</span>
    <span class="stat-pill-value" id="pillCount">0</span>
  </div>

  <div class="actions">
    <button class="btn-primary" id="mainBtn" onclick="handleMain()">Start</button>
    <button class="btn-ghost" onclick="openLeaderboard()">Stats &amp; History</button>
    <button class="btn-ghost" onclick="resetTimer()">Reset</button>
  </div>
</div>

<button class="menu-toggle" id="menuToggle" onclick="toggleMenu()"></button>

<div class="stage">
  <div class="hourglass-wrap">
    <div id="timerDisplay">00:00</div>
    <svg class="hg-svg" viewBox="0 0 300 480">
      <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   style="stop-color:rgba(255,255,255,0.04)"/>
          <stop offset="50%"  style="stop-color:rgba(255,255,255,0.09)"/>
          <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
        </linearGradient>
        <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   style="stop-color:#2a2820"/>
          <stop offset="100%" style="stop-color:#111"/>
        </linearGradient>
      </defs>
      <rect x="30"  y="15"  width="240" height="14" rx="2" fill="url(#capGrad)"/>
      <rect x="30"  y="451" width="240" height="14" rx="2" fill="url(#capGrad)"/>
      <rect x="38"  y="12"  width="224" height="5"  rx="1" fill="#333"/>
      <rect x="38"  y="463" width="224" height="5"  rx="1" fill="#333"/>
      <path d="M150,248 C65,228 42,100 42,29 L258,29 C258,100 235,228 150,248 C235,268 258,396 258,451 L42,451 C42,396 65,268 150,248 Z"
        fill="url(#glassGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </svg>
    <canvas id="sandCanvas" width="300" height="480"></canvas>
  </div>
</div>

<!-- ══════════════════════════════════
     LEADERBOARD MODAL
══════════════════════════════════ -->
<div class="lb-overlay" id="lbOverlay" onclick="closeLbOnBg(event)">
  <div class="lb-modal" id="lbModal">
    <div class="lb-header">
      <div>
        <div class="lb-title">My Stats</div>
        <div class="lb-subtitle">Personal Focus Record</div>
      </div>
      <button class="lb-close" onclick="closeLeaderboard()">✕</button>
    </div>

    <div class="lb-body">
      <!-- 2×2 stat cards -->
      <div class="lb-stats-grid">
        <div class="lb-stat-card">
          <div class="lb-stat-card-icon">✓</div>
          <div class="lb-stat-card-val" id="lbTotalSessions">0</div>
          <div class="lb-stat-card-label">Sessions Done</div>
        </div>
        <div class="lb-stat-card">
          <div class="lb-stat-card-icon">⏱</div>
          <div class="lb-stat-card-val" id="lbTotalTime">0<span>min</span></div>
          <div class="lb-stat-card-label">Total Focus</div>
        </div>
        <div class="lb-stat-card">
          <div class="lb-stat-card-icon">🔥</div>
          <div class="lb-stat-card-val" id="lbStreak">0<span>day</span></div>
          <div class="lb-stat-card-label">Current Streak</div>
        </div>
        <div class="lb-stat-card">
          <div class="lb-stat-card-icon">🏆</div>
          <div class="lb-stat-card-val" id="lbBestDay">0</div>
          <div class="lb-stat-card-label">Best Day</div>
        </div>
      </div>

      <!-- 7-day activity dots -->
      <div class="lb-section-label">Last 7 Days</div>
      <div class="lb-streak-row" id="lbStreakDots"></div>
      <div style="height:24px;"></div>

      <!-- Session history -->
      <div class="lb-section-label">Recent Sessions</div>
      <div class="lb-history" id="lbHistory"></div>
    </div>

    <div class="lb-footer">
      <button class="lb-clear-btn" onclick="clearStats()">Clear All Data</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════
   CANVAS / HOURGLASS
══════════════════════════════════════ */
const canvas = document.getElementById('sandCanvas');
const ctx    = canvas.getContext('2d');
const sidebar      = document.getElementById('sidebar');
const timerDisplay = document.getElementById('timerDisplay');
const glassPath = new Path2D("M150,248 C65,228 42,100 42,29 L258,29 C258,100 235,228 150,248 C235,268 258,396 258,451 L42,451 C42,396 65,268 150,248 Z");

let sandColor = "#c9a84c", isRunning = false, totalSeconds = 0, remainingSeconds = 0, lastTs = 0, particles = [];
let currentMins = 25;

function toggleMenu() { sidebar.classList.toggle('open'); }
function toggleTimerDisplay(checked) { timerDisplay.style.display = checked ? 'block' : 'none'; }

function updateMins(val) {
  currentMins = parseFloat(val) || 0;
  if (!isRunning) { remainingSeconds = 0; totalSeconds = 0; draw(); }
}

function updateSandColor(val) {
  sandColor = val;
  draw();
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function setPreset(m) {
  currentMins = m;
  document.getElementById('minInput').value = m;
  if (!isRunning) { remainingSeconds = 0; totalSeconds = 0; draw(); }
}

function handleMain() {
  if (!isRunning) {
    if (remainingSeconds <= 0 || totalSeconds === 0) {
      totalSeconds = currentMins * 60;
      remainingSeconds = totalSeconds;
    }
    isRunning = true;
    lastTs = performance.now();
    document.getElementById('mainBtn').textContent = "Pause";
    sidebar.classList.remove('open');
    requestAnimationFrame(loop);
  } else {
    isRunning = false;
    document.getElementById('mainBtn').textContent = "Resume";
  }
}

function resetTimer() {
  isRunning = false; remainingSeconds = 0; totalSeconds = 0; particles = [];
  document.getElementById('mainBtn').textContent = "Start";
  timerDisplay.textContent = "00:00";
  draw();
}

function loop(now) {
  if (!isRunning) return;
  const delta = (now - lastTs) / 1000;
  remainingSeconds = Math.max(0, remainingSeconds - delta);
  lastTs = now;
  timerDisplay.textContent = formatTime(remainingSeconds);
  if (remainingSeconds <= 0) {
    isRunning = false;
    remainingSeconds = 0;
    document.getElementById('mainBtn').textContent = "Start";
    // ── Record completed session ──
    recordSession(Math.round(totalSeconds / 60));
  }
  draw();
  if (isRunning) requestAnimationFrame(loop);
}

class Grain {
  constructor() {
    this.x = 150 + (Math.random() - 0.5) * 4;
    this.y = 248;
    this.vy = 4 + Math.random() * 3;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.r = 1.1;
    this.alpha = 0.6 + Math.random() * 0.4;
  }
  update() { this.y += this.vy; this.x += this.vx; }
}

function adjustBrightness(hex, factor) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const clamp = v => Math.min(255, Math.max(0, Math.round(v * factor)));
  return `rgb(${clamp(r)},${clamp(g)},${clamp(b)})`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const progress = (totalSeconds > 0) ? Math.max(0, Math.min(1, remainingSeconds / totalSeconds)) : 1;
  
  ctx.save();
  ctx.scale(canvas.width/300, canvas.height/480);
  ctx.clip(glassPath);

  // Top Sand
  const topH = 218 * progress; 
  ctx.fillStyle = sandColor; ctx.globalAlpha = 0.92;
  ctx.fillRect(42, 248 - topH, 216, topH);
  if (topH > 2) {
    ctx.beginPath(); ctx.moveTo(42, 248 - topH);
    ctx.bezierCurveTo(90, 248 - topH - 4, 210, 248 - topH + 4, 258, 248 - topH);
    ctx.fillStyle = adjustBrightness(sandColor, 1.2); ctx.globalAlpha = 0.5; ctx.fill();
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 249, 300, 231); ctx.clip();

  // BOTTOM SAND (Kinetic Accumulation)
  const invProgress = 1 - progress;
  const botBaseH = 202 * invProgress; 
  const peakHeight = invProgress < 0.95 ? (25 * Math.sin(invProgress * Math.PI)) : 0; 

  ctx.globalAlpha = 0.92; ctx.fillStyle = sandColor;
  
  ctx.beginPath();
  ctx.moveTo(42, 451);
  ctx.lineTo(42, 451 - botBaseH);
  ctx.quadraticCurveTo(150, 451 - botBaseH - peakHeight, 258, 451 - botBaseH);
  ctx.lineTo(258, 451);
  ctx.closePath();
  ctx.fill();

  if (botBaseH > 2) {
    ctx.beginPath();
    ctx.moveTo(42, 451 - botBaseH);
    ctx.quadraticCurveTo(150, 451 - botBaseH - peakHeight, 258, 451 - botBaseH);
    ctx.strokeStyle = adjustBrightness(sandColor, 1.15);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  if (isRunning && remainingSeconds > 0) {
    for (let i = 0; i < 3; i++) particles.push(new Grain());
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (isRunning) p.update();
    ctx.globalAlpha = p.alpha; ctx.fillStyle = sandColor;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    const currentSandTop = 451 - botBaseH - (peakHeight * (1 - Math.abs(150 - p.x)/100));
    if (p.y > currentSandTop) particles.splice(i, 1);
  }
  
  ctx.restore();
  ctx.restore();
}

draw();

/* ══════════════════════════════════════
   STATS / LEADERBOARD  (localStorage)
══════════════════════════════════════ */

const STORAGE_KEY = 'hg_sessions_v1';

/** Load the session log from localStorage. Returns array of {date, mins}. */
function loadSessions() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

/** Persist session log. */
function saveSessions(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

/** Called when a timer fully completes. */
function recordSession(mins) {
  const sessions = loadSessions();
  sessions.push({ date: new Date().toISOString(), mins });
  saveSessions(sessions);
  updatePillCount();
}

/** Returns today's date as YYYY-MM-DD string (local). */
function toDateStr(isoStr) {
  const d = new Date(isoStr);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayStr() {
  return toDateStr(new Date().toISOString());
}

/** Compute stats from session array. */
function computeStats(sessions) {
  const totalSessions = sessions.length;
  const totalMins = sessions.reduce((s, x) => s + x.mins, 0);

  // Group by date
  const byDate = {};
  sessions.forEach(s => {
    const d = toDateStr(s.date);
    byDate[d] = (byDate[d] || 0) + 1;
  });

  // Best day
  const bestDay = Object.values(byDate).reduce((a, b) => Math.max(a, b), 0);

  // Current streak (consecutive days ending today or yesterday)
  const today = new Date(); today.setHours(0,0,0,0);
  let streak = 0;
  let cursor = new Date(today);
  // Allow streak to extend if today hasn't been used yet (check yesterday too)
  if (!byDate[todayStr()]) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const key = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
    if (byDate[key]) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }

  // Last 7 days activity (true/false array, index 0 = 6 days ago, index 6 = today)
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    last7.push({ active: !!byDate[key], isToday: i === 0 });
  }

  return { totalSessions, totalMins, bestDay, streak, last7 };
}

/** Update the sidebar pill count. */
function updatePillCount() {
  const sessions = loadSessions();
  document.getElementById('pillCount').textContent = sessions.length;
}

/** Open the leaderboard modal and render content. */
function openLeaderboard() {
  const sessions = loadSessions();
  const stats    = computeStats(sessions);

  // Stat cards
  document.getElementById('lbTotalSessions').innerHTML = stats.totalSessions;
  const hrs = Math.floor(stats.totalMins / 60);
  const mins = stats.totalMins % 60;
  document.getElementById('lbTotalTime').innerHTML =
    hrs > 0 ? `${hrs}<span>hr</span> ${mins}<span>m</span>` : `${mins}<span>min</span>`;
  document.getElementById('lbStreak').innerHTML = `${stats.streak}<span>day${stats.streak !== 1 ? 's' : ''}</span>`;
  document.getElementById('lbBestDay').innerHTML = stats.bestDay
    ? `${stats.bestDay}<span>session${stats.bestDay !== 1 ? 's' : ''}</span>`
    : `0`;

  // 7-day dots
  const dotsEl = document.getElementById('lbStreakDots');
  dotsEl.innerHTML = '';
  stats.last7.forEach(day => {
    const dot = document.createElement('div');
    dot.className = 'lb-streak-day' + (day.isToday ? ' today' : (day.active ? ' active' : ''));
    dotsEl.appendChild(dot);
  });

  // Session history (most recent 15)
  const histEl = document.getElementById('lbHistory');
  histEl.innerHTML = '';
  if (sessions.length === 0) {
    histEl.innerHTML = '<div class="lb-empty">No sessions yet.<br>Complete your first timer to see history.</div>';
  } else {
    const recent = [...sessions].reverse().slice(0, 15);
    recent.forEach((s, i) => {
      const d    = new Date(s.date);
      const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      const rank = i < 3 ? ['gold','silver','bronze'][i] : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;

      const item = document.createElement('div');
      item.className = 'lb-history-item';
      item.innerHTML = `
        <span class="lb-history-rank ${rank}">${medal}</span>
        <span class="lb-history-date">${dateStr} · ${timeStr}</span>
        <span class="lb-history-dur">${s.mins} min</span>
        <div class="lb-history-badge"></div>
      `;
      histEl.appendChild(item);
    });
  }

  document.getElementById('lbOverlay').classList.add('visible');
}

function closeLeaderboard() {
  document.getElementById('lbOverlay').classList.remove('visible');
}

function closeLbOnBg(e) {
  if (e.target === document.getElementById('lbOverlay')) closeLeaderboard();
}

function clearStats() {
  if (!confirm('Clear all session history? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  updatePillCount();
  openLeaderboard(); // re-render empty state
}

// Init pill on load
updatePillCount();
</script>
