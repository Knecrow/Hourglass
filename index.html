<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #dfb76c;
    --gold-bright: #f3cf88;
    --bg: #0a0a0c;
    --text: #ede8df;
    --muted: #5e5b55;
    --mono: 'DM Mono', monospace;
    --sans: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    background-image: radial-gradient(circle at 50% 48%, rgba(223, 183, 108, 0.05) 0%, transparent 65%);
  }

  /* ── Discreet Corner Action (Opacity 0.25 -> 1 on hover) ── */
  .corner-bar {
    position: fixed;
    top: 24px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0.25;
    transition: opacity 0.3s ease;
    z-index: 10;
  }
  .corner-bar:hover {
    opacity: 0.9;
  }

  .subtle-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    transition: color 0.2s;
  }
  .subtle-btn:hover { color: var(--text); }

  /* ── Centered Pure Focal Stage ── */
  .zen-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }

  .hourglass-wrap {
    position: relative;
    width: 250px;
    height: 360px;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.5));
    transition: transform 0.3s ease;
  }
  .hourglass-wrap:hover {
    transform: scale(1.01);
  }

  canvas, svg.hg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  svg.hg-svg { z-index: 1; pointer-events: none; }
  canvas { z-index: 2; }

  /* ── Time & Controls Below Glass ── */
  .bottom-flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
    transition: opacity 0.5s ease;
  }

  .time-display {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--text);
    opacity: 0.85;
    cursor: pointer;
    transition: color 0.3s, opacity 0.3s;
  }
  .time-display:hover {
    color: var(--gold);
  }
  .time-display.active {
    color: var(--gold);
    text-shadow: 0 0 20px rgba(223, 183, 108, 0.2);
  }

  /* Quiet Presets: just 3 clean numbers */
  .presets-quiet {
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0.45;
    transition: opacity 0.25s;
  }
  .presets-quiet:hover {
    opacity: 0.9;
  }
  .preset-dot {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .preset-dot:hover, .preset-dot.active {
    color: var(--gold);
  }

  /* Main Action Button */
  .btn-zen {
    background: transparent;
    border: 1px solid rgba(223, 183, 108, 0.25);
    border-radius: 20px;
    padding: 8px 26px;
    color: var(--gold);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-zen:hover {
    background: rgba(223, 183, 108, 0.1);
    border-color: rgba(223, 183, 108, 0.5);
    color: var(--gold-bright);
  }
  .btn-zen.running {
    border-color: rgba(255, 255, 255, 0.1);
    color: var(--muted);
  }
  .btn-zen.running:hover {
    border-color: rgba(255, 255, 255, 0.25);
    color: var(--text);
  }

  /* Zen Mode: When running, fade presets and buttons down quietly */
  body.running .presets-quiet,
  body.running .btn-zen {
    opacity: 0.2;
    transition: opacity 0.5s ease;
  }
  body.running .bottom-flow:hover .presets-quiet,
  body.running .bottom-flow:hover .btn-zen {
    opacity: 0.85;
  }

  /* ── Stats Modal (Tucked away quietly) ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 10, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-card {
    width: 320px;
    background: #111114;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: var(--mono);
    font-size: 11px;
  }
  .stat-row span:first-child { color: var(--muted); }
  .stat-row span:last-child { color: var(--text); }
</style>
</head>
<body>

<!-- Quiet Top-Right Stats / Settings -->
<div class="corner-bar">
  <button class="subtle-btn" onclick="openStatsModal()" title="View Focus Stats">
    <span>🏆</span>
    <span id="sessionCount">0</span>
  </button>
</div>

<!-- Pure Central Focus -->
<div class="zen-stage">
  <div class="hourglass-wrap" onclick="toggleTimer()" title="Click hourglass or press Space to start/pause">
    <svg class="hg-svg" viewBox="0 0 300 480">
      <defs>
        <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(255,255,255,0.06)"/>
          <stop offset="25%" style="stop-color:rgba(255,255,255,0.015)"/>
          <stop offset="80%" style="stop-color:rgba(255,255,255,0.01)"/>
          <stop offset="100%" style="stop-color:rgba(255,255,255,0.07)"/>
        </linearGradient>
        <linearGradient id="capShine" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#26262a"/>
          <stop offset="100%" style="stop-color:#121214"/>
        </linearGradient>
      </defs>
      <!-- Minimalist Caps -->
      <rect x="42" y="16" width="216" height="8" rx="2" fill="url(#capShine)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="42" y="456" width="216" height="8" rx="2" fill="url(#capShine)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <!-- Outer Glass Contour -->
      <path d="M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z"
        fill="url(#glassReflect)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
    </svg>
    <canvas id="sandCanvas" width="300" height="480"></canvas>
  </div>

  <div class="bottom-flow">
    <!-- Time Numbers (Click to customize) -->
    <div class="time-display" id="timeDisplay" onclick="promptCustomMinutes()" title="Click to customize time">25:00</div>

    <!-- Quiet Presets -->
    <div class="presets-quiet">
      <button class="preset-dot" onclick="selectPreset(15)">15m</button>
      <button class="preset-dot active" id="dot25" onclick="selectPreset(25)">25m</button>
      <button class="preset-dot" onclick="selectPreset(45)">45m</button>
    </div>

    <!-- Clean Start / Pause Action -->
    <button class="btn-zen" id="startBtn" onclick="toggleTimer()">Start</button>
  </div>
</div>

<!-- Discreet Stats Modal -->
<div class="modal-overlay" id="statsOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Focus Record</div>
      <button class="modal-close" onclick="closeStatsModal()">✕</button>
    </div>
    <div class="stat-row">
      <span>Completed Sessions</span>
      <span id="statSessions">0</span>
    </div>
    <div class="stat-row">
      <span>Total Focus Time</span>
      <span id="statTime">0m</span>
    </div>
    <div class="stat-row">
      <span>Day Streak</span>
      <span id="statStreak">0d</span>
    </div>
    <div class="stat-row">
      <span>Best Day</span>
      <span id="statBest">0</span>
    </div>
  </div>
</div>

<script>
/* ── Canvas & State ── */
const canvas = document.getElementById('sandCanvas');
const ctx = canvas.getContext('2d');
const glassPath = new Path2D("M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z");

const sandColor = "#dfb76c";
let isRunning = false;
let currentMinutes = 25;
let totalSeconds = 25 * 60;
let remainingSeconds = 25 * 60;
let lastTimestamp = 0;

let particles = [];
let splashParticles = [];

/* ── Minimalist Web Audio Chime ── */
let audioCtx = null;
function playCompletionChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(528, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 2.2);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.3);
  } catch (e) {}
}

/* ── Presets & Time ── */
function formatTimer(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updateDisplay() {
  const formatted = formatTimer(remainingSeconds);
  document.getElementById('timeDisplay').textContent = formatted;
  document.title = isRunning ? `(${formatted}) Chronos` : 'Chronos';
}

function selectPreset(m) {
  if (isRunning) toggleTimer();
  currentMinutes = m;
  totalSeconds = m * 60;
  remainingSeconds = totalSeconds;

  document.querySelectorAll('.preset-dot').forEach(d => d.classList.remove('active'));
  const activeDot = Array.from(document.querySelectorAll('.preset-dot')).find(d => d.textContent === `${m}m`);
  if (activeDot) activeDot.classList.add('active');

  updateDisplay();
  draw();
}

function promptCustomMinutes() {
  const val = prompt("Custom minutes:", currentMinutes);
  if (!val) return;
  const num = parseInt(val, 10);
  if (!isNaN(num) && num > 0 && num <= 180) {
    selectPreset(num);
  }
}

/* ── Timer Controls ── */
function toggleTimer(e) {
  if (e) e.stopPropagation();
  if (!isRunning) {
    if (remainingSeconds <= 0) {
      remainingSeconds = totalSeconds;
    }
    isRunning = true;
    lastTimestamp = performance.now();
    document.body.classList.add('running');
    document.getElementById('startBtn').textContent = "Pause";
    document.getElementById('startBtn').classList.add('running');
    document.getElementById('timeDisplay').classList.add('active');
    requestAnimationFrame(animationLoop);
  } else {
    isRunning = false;
    document.body.classList.remove('running');
    document.getElementById('startBtn').textContent = "Resume";
    document.getElementById('startBtn').classList.remove('running');
    document.getElementById('timeDisplay').classList.remove('active');
  }
}

function resetTimer() {
  isRunning = false;
  remainingSeconds = totalSeconds;
  particles = [];
  splashParticles = [];
  document.body.classList.remove('running');
  document.getElementById('startBtn').textContent = "Start";
  document.getElementById('startBtn').classList.remove('running');
  document.getElementById('timeDisplay').classList.remove('active');
  updateDisplay();
  draw();
}

function animationLoop(now) {
  if (!isRunning) return;
  const delta = (now - lastTimestamp) / 1000;
  remainingSeconds = Math.max(0, remainingSeconds - delta);
  lastTimestamp = now;

  updateDisplay();

  if (remainingSeconds <= 0) {
    isRunning = false;
    remainingSeconds = 0;
    document.body.classList.remove('running');
    document.getElementById('startBtn').textContent = "Start";
    document.getElementById('startBtn').classList.remove('running');
    document.getElementById('timeDisplay').classList.remove('active');
    playCompletionChime();
    recordSession(currentMinutes);
  }

  draw();
  if (isRunning) requestAnimationFrame(animationLoop);
}

/* ── Keyboard Shortcuts ── */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    toggleTimer();
  } else if (e.code === 'KeyR') {
    resetTimer();
  } else if (e.code === 'Escape') {
    closeStatsModal();
  }
});

/* ── Particles ── */
class SandGrain {
  constructor() {
    this.x = 150 + (Math.random() - 0.5) * 2.2;
    this.y = 248;
    this.vy = 4.5 + Math.random() * 3.5;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.radius = 1.0;
    this.alpha = 0.75 + Math.random() * 0.25;
  }
  update() { this.y += this.vy; this.x += this.vx; }
}

class SplashGrain {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2.5;
    this.vy = -(0.8 + Math.random() * 1.8);
    this.alpha = 0.7;
    this.radius = 0.8;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.2;
    this.alpha -= 0.05;
  }
}

/* ── Canvas Drawing ── */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const progress = totalSeconds > 0 ? Math.max(0, Math.min(1, remainingSeconds / totalSeconds)) : 1;

  ctx.save();
  ctx.scale(canvas.width / 300, canvas.height / 480);
  ctx.clip(glassPath);

  // Upper chamber sand (gentle funneling)
  if (progress > 0.002) {
    const topH = 224 * progress;
    const topY = 248 - topH;
    const craterDepth = Math.min(16, (1 - progress) * 22);

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, topY);
    ctx.quadraticCurveTo(150, topY + craterDepth, 258, topY);
    ctx.lineTo(258, 248);
    ctx.lineTo(42, 248);
    ctx.closePath();
    ctx.fill();
  }

  // Lower chamber sand (smooth dune accumulation)
  const invProgress = 1 - progress;
  if (invProgress > 0.002) {
    const botH = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2;

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, 456);
    ctx.lineTo(42, 456 - botH);
    ctx.quadraticCurveTo(150, 456 - botH - peakHeight, 258, 456 - botH);
    ctx.lineTo(258, 456);
    ctx.closePath();
    ctx.fill();
  }

  // Active falling stream & grains
  if (isRunning && remainingSeconds > 0) {
    const botH = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2;
    const currentMoundTop = 456 - botH - peakHeight;

    // Fluid stream line
    ctx.strokeStyle = sandColor;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(150, 248);
    ctx.lineTo(150, currentMoundTop);
    ctx.stroke();

    for (let i = 0; i < 2; i++) particles.push(new SandGrain());
    if (Math.random() < 0.3) splashParticles.push(new SplashGrain(150, currentMoundTop));
  }

  // Draw grains
  const currentTop = 456 - (208 * invProgress) - (invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 20 : 2);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (isRunning) p.update();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    if (p.y >= currentTop) particles.splice(i, 1);
  }

  for (let i = splashParticles.length - 1; i >= 0; i--) {
    const sp = splashParticles[i];
    sp.update();
    if (sp.alpha <= 0) { splashParticles.splice(i, 1); continue; }
    ctx.globalAlpha = sp.alpha;
    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ── Local Stats ── */
const STORAGE_KEY = 'hg_sessions_v1';
function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function recordSession(mins) {
  const list = getSessions();
  list.push({ date: new Date().toISOString(), mins });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  refreshSessionCount();
}
function refreshSessionCount() {
  document.getElementById('sessionCount').textContent = getSessions().length;
}

function openStatsModal() {
  const list = getSessions();
  const totalMins = list.reduce((a, b) => a + b.mins, 0);
  document.getElementById('statSessions').textContent = list.length;
  document.getElementById('statTime').textContent = `${totalMins}m`;

  const byDate = {};
  list.forEach(s => { const d = s.date.slice(0, 10); byDate[d] = (byDate[d] || 0) + 1; });
  document.getElementById('statBest').textContent = Object.values(byDate).reduce((a, b) => Math.max(a, b), 0);

  let streak = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  const todayKey = cursor.toISOString().slice(0, 10);
  if (!byDate[todayKey]) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const k = cursor.toISOString().slice(0, 10);
    if (byDate[k]) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  document.getElementById('statStreak').textContent = `${streak}d`;
  document.getElementById('statsOverlay').classList.add('open');
}

function closeStatsModal() {
  document.getElementById('statsOverlay').classList.remove('open');
}
function handleOverlayClick(e) {
  if (e.target.id === 'statsOverlay') closeStatsModal();
}

/* ── Init ── */
refreshSessionCount();
updateDisplay();
draw();
</script>
</body>
</html>
