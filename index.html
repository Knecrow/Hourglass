<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos · Focus Hourglass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #dfb76c;
    --gold-bright: #f3cf88;
    --gold-dim: #8c6e32;
    --gold-glow: rgba(223, 183, 108, 0.15);
    --bg: #0c0c0e;
    --surface: rgba(22, 22, 26, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f0ebe1;
    --muted: #737069;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --mono: 'DM Mono', monospace;
    --sans: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    background-image: 
      radial-gradient(circle at 50% 42%, rgba(223, 183, 108, 0.07) 0%, transparent 60%),
      radial-gradient(circle at 50% 100%, rgba(20, 20, 24, 0.8) 0%, var(--bg) 80%);
  }

  /* ── Header ── */
  header {
    height: 64px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .brand {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.07);
    color: var(--text);
    border-color: rgba(255,255,255,0.18);
  }
  .icon-btn.active {
    color: var(--gold);
    border-color: rgba(223, 183, 108, 0.35);
    background: var(--gold-glow);
  }

  .color-btn {
    position: relative;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
  }
  .color-swatch-preview {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }
  .color-native-input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  /* ── Main Canvas Stage ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-bottom: 20px;
  }

  .timer-wrap {
    text-align: center;
    margin-bottom: 18px;
    cursor: pointer;
  }

  .timer-numbers {
    font-family: var(--mono);
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 5px;
    color: var(--text);
    transition: color 0.3s ease, transform 0.2s ease;
  }
  .timer-numbers.active {
    color: var(--gold);
    text-shadow: 0 0 24px rgba(223, 183, 108, 0.25);
  }
  .timer-sublabel {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    transition: opacity 0.2s;
  }

  .hourglass-stage {
    position: relative;
    width: 260px;
    height: 380px;
    margin-bottom: 26px;
    filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
  }

  canvas, svg.hg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  svg.hg-svg { z-index: 1; pointer-events: none; }
  canvas { z-index: 2; }

  /* ── Zen Control Hub ── */
  .controls-hub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .presets-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.03);
    padding: 4px 6px;
    border-radius: 24px;
    border: 1px solid var(--border);
  }

  .preset-pill {
    background: transparent;
    border: none;
    border-radius: 16px;
    padding: 6px 14px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .preset-pill:hover {
    color: var(--text);
  }
  .preset-pill.active {
    background: rgba(255, 255, 255, 0.08);
    color: var(--gold);
    font-weight: 500;
  }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-start {
    background: var(--gold);
    color: #0c0c0e;
    border: none;
    border-radius: 28px;
    padding: 12px 36px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 4px 18px rgba(223, 183, 108, 0.25);
  }
  .btn-start:hover {
    background: var(--gold-bright);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(223, 183, 108, 0.4);
  }
  .btn-start.running {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-start.running:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  .btn-action-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
  }
  .btn-action-icon:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
    background: rgba(255, 255, 255, 0.07);
    transform: rotate(-15deg);
  }

  .keyboard-hints {
    font-family: var(--mono);
    font-size: 9px;
    color: rgba(115, 112, 105, 0.6);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ── Minimalist Stats Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 10, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal-card {
    width: 360px;
    max-height: 85vh;
    background: #131316;
    border: 1px solid rgba(223, 183, 108, 0.2);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    transform: translateY(12px);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  .modal-overlay.open .modal-card {
    transform: translateY(0);
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title {
    font-family: var(--serif);
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close:hover { color: var(--text); }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--text);
  }
  .stat-val span { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .stat-label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    max-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 10px;
  }
  .history-time { color: var(--muted); }
  .history-dur { color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="brand">Chronos</div>
  <div class="header-actions">
    <button class="icon-btn active" id="chimeToggleBtn" onclick="toggleChime()" title="Gentle completion chime">
      <span id="chimeIcon">🔔</span>
    </button>
    <div class="color-btn" title="Change sand color">
      <div class="color-swatch-preview" id="colorSwatch"></div>
      <input type="color" id="sandPicker" class="color-native-input" value="#dfb76c" oninput="changeSandColor(this.value)">
    </div>
    <button class="icon-btn" onclick="openStatsModal()" title="View session stats">
      <span>🏆</span>
      <span id="headerSessionCount">0</span>
    </button>
  </div>
</header>

<main>
  <div class="timer-wrap" onclick="promptCustomMinutes()" title="Click to set custom minutes">
    <div class="timer-numbers" id="timerNumbers">25:00</div>
    <div class="timer-sublabel" id="timerStatus">Click to customize · Focus</div>
  </div>

  <div class="hourglass-stage">
    <svg class="hg-svg" viewBox="0 0 300 480">
      <defs>
        <!-- Glass reflections -->
        <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(255,255,255,0.07)"/>
          <stop offset="25%" style="stop-color:rgba(255,255,255,0.02)"/>
          <stop offset="80%" style="stop-color:rgba(255,255,255,0.01)"/>
          <stop offset="100%" style="stop-color:rgba(255,255,255,0.09)"/>
        </linearGradient>
        <linearGradient id="capShine" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#2a2a2e"/>
          <stop offset="100%" style="stop-color:#141416"/>
        </linearGradient>
      </defs>
      <!-- Top and Bottom Minimalist Caps -->
      <rect x="36" y="14" width="228" height="10" rx="3" fill="url(#capShine)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="36" y="456" width="228" height="10" rx="3" fill="url(#capShine)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Soft Outer Glass Contour -->
      <path d="M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z"
        fill="url(#glassReflect)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    </svg>
    <canvas id="sandCanvas" width="300" height="480"></canvas>
  </div>

  <div class="controls-hub">
    <div class="presets-row">
      <button class="preset-pill" onclick="selectPreset(5)">5m</button>
      <button class="preset-pill" onclick="selectPreset(15)">15m</button>
      <button class="preset-pill active" id="preset25" onclick="selectPreset(25)">25m</button>
      <button class="preset-pill" onclick="selectPreset(45)">45m</button>
      <button class="preset-pill" onclick="selectPreset(60)">60m</button>
    </div>

    <div class="actions-row">
      <button class="btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-action-icon" onclick="resetTimer()" title="Reset (R)">↺</button>
    </div>

    <div class="keyboard-hints">Space to toggle · R to reset</div>
  </div>
</main>

<!-- Stats Modal -->
<div class="modal-overlay" id="statsOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Focus Record</div>
      <button class="modal-close" onclick="closeStatsModal()">✕</button>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="statSessions">0</div>
        <div class="stat-label">Sessions Completed</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statTime">0<span>m</span></div>
        <div class="stat-label">Total Focus Time</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statStreak">0<span>d</span></div>
        <div class="stat-label">Day Streak</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statBest">0</div>
        <div class="stat-label">Best Day</div>
      </div>
    </div>

    <div style="font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">Recent Sessions</div>
    <div class="history-list" id="modalHistoryList">
      <div style="text-align:center;padding:20px;font-family:var(--mono);font-size:10px;color:var(--muted);">No completed sessions yet</div>
    </div>
  </div>
</div>

<script>
/* ── State & Configuration ── */
const canvas = document.getElementById('sandCanvas');
const ctx = canvas.getContext('2d');
const glassPath = new Path2D("M150,248 C65,228 42,100 42,24 L258,24 C258,100 235,228 150,248 C235,268 258,396 258,456 L42,456 C42,396 65,268 150,248 Z");

let sandColor = "#dfb76c";
let isRunning = false;
let currentMinutes = 25;
let totalSeconds = 25 * 60;
let remainingSeconds = 25 * 60;
let lastTimestamp = 0;
let chimeEnabled = true;

// Flow particles & stream
let particles = [];
let splashParticles = [];

/* ── Web Audio Chime (Gentle singing-bowl frequency) ── */
let audioCtx = null;
function playCompletionChime() {
  if (!chimeEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    
    // Fundamental tone (warm calming bell)
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(528, now); // 528Hz Solfeggio / clarity tone
    osc.frequency.exponentialRampToValueAtTime(520, now + 2.5);

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.6);

    // Subtle soft harmonic overtone
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1056, now);
    gain2.gain.setValueAtTime(0.08, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now);
    osc2.stop(now + 1.9);
  } catch (e) {
    console.warn("Audio unavailable:", e);
  }
}

function toggleChime() {
  chimeEnabled = !chimeEnabled;
  document.getElementById('chimeIcon').textContent = chimeEnabled ? '🔔' : '🔕';
  document.getElementById('chimeToggleBtn').classList.toggle('active', chimeEnabled);
}

/* ── Color Control ── */
function changeSandColor(color) {
  sandColor = color;
  document.getElementById('colorSwatch').style.background = color;
  document.getElementById('colorSwatch').style.boxShadow = `0 0 8px ${color}`;
  draw();
}

/* ── Presets & Time Formatting ── */
function formatTimer(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updateDisplay() {
  const formatted = formatTimer(remainingSeconds);
  document.getElementById('timerNumbers').textContent = formatted;
  document.title = isRunning ? `(${formatted}) Chronos` : 'Chronos · Focus Hourglass';
}

function selectPreset(m) {
  if (isRunning) toggleTimer(); // Pause if changing
  currentMinutes = m;
  totalSeconds = m * 60;
  remainingSeconds = totalSeconds;

  document.querySelectorAll('.preset-pill').forEach(btn => btn.classList.remove('active'));
  const activeBtn = Array.from(document.querySelectorAll('.preset-pill')).find(b => b.textContent === `${m}m`);
  if (activeBtn) activeBtn.classList.add('active');

  document.getElementById('timerStatus').textContent = `Focus Session · ${m} min`;
  updateDisplay();
  draw();
}

function promptCustomMinutes() {
  const val = prompt("Enter custom focus minutes (1 - 180):", currentMinutes);
  if (!val) return;
  const num = parseInt(val, 10);
  if (!isNaN(num) && num > 0 && num <= 180) {
    selectPreset(num);
  }
}

/* ── Timer Controls ── */
function toggleTimer() {
  if (!isRunning) {
    if (remainingSeconds <= 0) {
      remainingSeconds = totalSeconds;
    }
    isRunning = true;
    lastTimestamp = performance.now();
    document.getElementById('startBtn').textContent = "Pause";
    document.getElementById('startBtn').classList.add('running');
    document.getElementById('timerNumbers').classList.add('active');
    document.getElementById('timerStatus').textContent = "Flow in progress...";
    requestAnimationFrame(animationLoop);
  } else {
    isRunning = false;
    document.getElementById('startBtn').textContent = "Resume";
    document.getElementById('startBtn').classList.remove('running');
    document.getElementById('timerNumbers').classList.remove('active');
    document.getElementById('timerStatus').textContent = "Paused";
  }
}

function resetTimer() {
  isRunning = false;
  remainingSeconds = totalSeconds;
  particles = [];
  splashParticles = [];
  document.getElementById('startBtn').textContent = "Start";
  document.getElementById('startBtn').classList.remove('running');
  document.getElementById('timerNumbers').classList.remove('active');
  document.getElementById('timerStatus').textContent = "Click to customize · Focus";
  updateDisplay();
  draw();
}

/* ── Animation Loop ── */
function animationLoop(now) {
  if (!isRunning) return;
  const delta = (now - lastTimestamp) / 1000;
  remainingSeconds = Math.max(0, remainingSeconds - delta);
  lastTimestamp = now;

  updateDisplay();

  if (remainingSeconds <= 0) {
    isRunning = false;
    remainingSeconds = 0;
    document.getElementById('startBtn').textContent = "Start";
    document.getElementById('startBtn').classList.remove('running');
    document.getElementById('timerNumbers').classList.remove('active');
    document.getElementById('timerStatus').textContent = "Session Complete ✨";
    playCompletionChime();
    recordSession(currentMinutes);
  }

  draw();
  if (isRunning) requestAnimationFrame(animationLoop);
}

/* ── Keyboard Shortcuts ── */
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    toggleTimer();
  } else if (e.code === 'KeyR') {
    resetTimer();
  } else if (e.code === 'Escape') {
    closeStatsModal();
  }
});

/* ── Particle Dynamics ── */
class SandGrain {
  constructor() {
    this.x = 150 + (Math.random() - 0.5) * 2.5;
    this.y = 248;
    this.vy = 4.5 + Math.random() * 3.5;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.radius = 1.0 + Math.random() * 0.4;
    this.alpha = 0.7 + Math.random() * 0.3;
  }
  update() {
    this.y += this.vy;
    this.x += this.vx;
  }
}

class SplashGrain {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = -(1 + Math.random() * 2);
    this.alpha = 0.8;
    this.radius = 0.9;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.2; // gravity
    this.alpha -= 0.04;
  }
}

function shadeColor(hex, percent) {
  let num = parseInt(hex.slice(1), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
  return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
}

/* ── Beautiful Canvas Renderer ── */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const progress = totalSeconds > 0 ? Math.max(0, Math.min(1, remainingSeconds / totalSeconds)) : 1;

  ctx.save();
  ctx.scale(canvas.width / 300, canvas.height / 480);
  ctx.clip(glassPath);

  // 1. TOP CHAMBER SAND (Natural funneling curve towards neck)
  if (progress > 0.002) {
    const topH = 224 * progress;
    const topY = 248 - topH;
    // Funnel crater forms in center as sand drops
    const craterDepth = Math.min(18, (1 - progress) * 24);

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, topY);
    // Upper crater curve
    ctx.quadraticCurveTo(150, topY + craterDepth, 258, topY);
    ctx.lineTo(258, 248);
    ctx.lineTo(42, 248);
    ctx.closePath();
    ctx.fill();

    // Subtle highlight rim across upper sand dune
    ctx.beginPath();
    ctx.moveTo(42, topY);
    ctx.quadraticCurveTo(150, topY + craterDepth, 258, topY);
    ctx.strokeStyle = shadeColor(sandColor, 25);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // 2. BOTTOM CHAMBER SAND (Smooth kinetic mound with gentle settling peak)
  const invProgress = 1 - progress;
  if (invProgress > 0.002) {
    const botH = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 22 : 2;

    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.moveTo(42, 456);
    ctx.lineTo(42, 456 - botH);
    // Smooth dune peak
    ctx.quadraticCurveTo(150, 456 - botH - peakHeight, 258, 456 - botH);
    ctx.lineTo(258, 456);
    ctx.closePath();
    ctx.fill();

    // Dune edge highlight
    ctx.beginPath();
    ctx.moveTo(42, 456 - botH);
    ctx.quadraticCurveTo(150, 456 - botH - peakHeight, 258, 456 - botH);
    ctx.strokeStyle = shadeColor(sandColor, 20);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 3. FLUID STREAM & PARTICLES
  if (isRunning && remainingSeconds > 0) {
    const invProgress = 1 - progress;
    const botH = 208 * invProgress;
    const peakHeight = invProgress < 0.96 ? Math.sin(invProgress * Math.PI) * 22 : 2;
    const currentMoundTop = 456 - botH - peakHeight;

    // Continuous glowing stream line through neck
    ctx.save();
    const streamGrad = ctx.createLinearGradient(150, 248, 150, currentMoundTop);
    streamGrad.addColorStop(0, sandColor);
    streamGrad.addColorStop(0.85, sandColor);
    streamGrad.addColorStop(1, shadeColor(sandColor, 30));

    ctx.strokeStyle = streamGrad;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(150, 248);
    ctx.lineTo(150, currentMoundTop);
    ctx.stroke();
    ctx.restore();

    // Spawn stream grains
    for (let i = 0; i < 2; i++) {
      particles.push(new SandGrain());
    }

    // Spawn tiny splash at impact
    if (Math.random() < 0.35) {
      splashParticles.push(new SplashGrain(150, currentMoundTop));
    }
  }

  // Update & draw falling stream grains
  const invP = 1 - progress;
  const currentTop = 456 - (208 * invP) - (invP < 0.96 ? Math.sin(invP * Math.PI) * 22 : 2);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (isRunning) p.update();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    if (p.y >= currentTop) {
      particles.splice(i, 1);
    }
  }

  // Update & draw impact splash
  for (let i = splashParticles.length - 1; i >= 0; i--) {
    const sp = splashParticles[i];
    sp.update();
    if (sp.alpha <= 0) {
      splashParticles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = sp.alpha;
    ctx.fillStyle = sandColor;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ── Local Stats Tracking (Preserved) ── */
const STORAGE_KEY = 'hg_sessions_v1';

function getSessions() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function recordSession(mins) {
  const list = getSessions();
  list.push({ date: new Date().toISOString(), mins });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  refreshHeaderPill();
}

function refreshHeaderPill() {
  const list = getSessions();
  document.getElementById('headerSessionCount').textContent = list.length;
}

function openStatsModal() {
  const list = getSessions();
  const totalMins = list.reduce((a, b) => a + b.mins, 0);

  document.getElementById('statSessions').textContent = list.length;
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  document.getElementById('statTime').innerHTML = hrs > 0 ? `${hrs}<span>h</span> ${mins}<span>m</span>` : `${mins}<span>m</span>`;

  // Streak calc
  const byDate = {};
  list.forEach(s => {
    const d = s.date.slice(0, 10);
    byDate[d] = (byDate[d] || 0) + 1;
  });
  const bestDay = Object.values(byDate).reduce((a, b) => Math.max(a, b), 0);
  document.getElementById('statBest').textContent = bestDay;

  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  const todayKey = cursor.toISOString().slice(0, 10);
  if (!byDate[todayKey]) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const k = cursor.toISOString().slice(0, 10);
    if (byDate[k]) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  document.getElementById('statStreak').innerHTML = `${streak}<span>d</span>`;

  // History render
  const histEl = document.getElementById('modalHistoryList');
  if (list.length === 0) {
    histEl.innerHTML = '<div style="text-align:center;padding:20px;font-family:var(--mono);font-size:10px;color:var(--muted);">No completed sessions yet</div>';
  } else {
    histEl.innerHTML = '';
    [...list].reverse().slice(0, 10).forEach(s => {
      const d = new Date(s.date);
      const row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = `
        <span class="history-time">${d.toLocaleDateString(undefined, {month:'short', day:'numeric'})} · ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        <span class="history-dur">${s.mins} min</span>
      `;
      histEl.appendChild(row);
    });
  }

  document.getElementById('statsOverlay').classList.add('open');
}

function closeStatsModal() {
  document.getElementById('statsOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target.id === 'statsOverlay') closeStatsModal();
}

/* ── Initial Render ── */
refreshHeaderPill();
updateDisplay();
draw();
</script>
